name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 build.py
      - uses: actions/cache@v4
        with:
          path: .tilecache
          key: usgs-houston-region-z8-13-city-z14-15-v1
      - run: ./tools/packs.sh
      - uses: actions/cache@v4
        with:
          path: dist/packs/places
          key: overture-places-2026-09-23.0-${{ hashFiles('tools/places_pack.py') }}
      - run: |
          if [ ! -f dist/packs/places/index.json ]; then
            pip install duckdb==1.5.5 && python3 tools/places_pack.py --release 2026-09-23.0 --out dist/packs/places
          fi
      - uses: actions/cache@v4
        with:
          path: dist/packs/labels
          key: protomaps-houston-z14-v1
      - run: if [ ! -f dist/packs/labels/houston.pmtiles ]; then ./tools/labels_pack.sh; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
